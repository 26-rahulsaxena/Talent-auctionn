<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Talent Auction</title>
<meta name="description" content="Talent Auction: a live hiring auction game for HR and managers. Play against the AI, watch two AIs, or play another manager online.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23060A14'/%3E%3Cpath d='M7 21l8-8M12 8l6 6M17 9l-5 5M20 23h7' stroke='%23FFC83D' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#060A14}
a{color:#8CC8FF}a:hover{color:#C4E2FF}
.ta{--ink:255,255,255;--goldbg:#FFC83D;--bg:#060A14;--p1:#0E1630;--p2:#152044;--p3:#1D2B57;--line:#2A3A6E;--tx:#F2F5FF;--mu:#AEB9D9;--hu:#3D9BFF;--ai:#FF7A2F;--gold:#FFC83D;--bad:#FF5A6A;--ok:#33E0A1;
  min-height:100vh;color:var(--tx);font-family:'Barlow',system-ui,sans-serif;font-size:15px;line-height:1.4;position:relative;overflow-x:clip;
  background:radial-gradient(900px 500px at 15% -10%,rgba(61,155,255,.18),transparent 60%),radial-gradient(900px 500px at 85% -10%,rgba(255,122,47,.16),transparent 60%),#060A14}
.ta *{box-sizing:border-box}
.wrap{max-width:1320px;margin:0 auto;padding:16px 16px 40px;position:relative;z-index:1}
.d{font-family:'Barlow Condensed','Arial Narrow',sans-serif;text-transform:uppercase;letter-spacing:.02em;font-weight:800}
.num{font-family:'Barlow Condensed',sans-serif;font-variant-numeric:tabular-nums;font-weight:800}
.mu{color:var(--mu)}
.k{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.hu{color:var(--hu)}.ai{color:var(--ai)}.gold{color:var(--gold)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fillc{fill:currentColor;stroke:none}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.panel{background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:18px;padding:16px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:800 18px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;min-height:50px;padding:0 24px;border-radius:14px;border:2px solid transparent;cursor:pointer;transition:transform .12s,box-shadow .2s,background .2s;color:var(--tx)}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn-go{background:linear-gradient(180deg,#FFD866,#FFB800);color:#1A1200;box-shadow:0 6px 0 #A87700,0 10px 30px rgba(255,200,61,.35)}
.btn-go:active{box-shadow:0 2px 0 #A87700}
.btn-ghost{background:rgba(var(--ink),.04);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--mu)}
.btn:disabled{background:#1B2547;color:#6E7AA0;box-shadow:none;border-color:#1B2547;cursor:not-allowed;transform:none}
.btn-sm{min-height:44px;font-size:15px;padding:0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--ink),.04);color:var(--mu);white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip-gold{background:var(--gold);color:#1A1200;border-color:var(--gold)}
.chip-hu{color:var(--hu);border-color:rgba(61,155,255,.5)}
.chip-ai{color:var(--ai);border-color:rgba(255,122,47,.5)}
.chip-bad{color:#FF8A95;border-color:rgba(255,90,106,.6)}
.chip-ok{color:var(--ok);border-color:rgba(51,224,161,.5)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%;border:3px solid;display:flex;align-items:center;justify-content:center;position:relative;background:radial-gradient(circle at 35% 30%,#2A3B72,#101A38);font:800 16px 'Barlow Condensed',sans-serif;letter-spacing:.04em;flex:none}
.av .badge{position:absolute;right:-6px;bottom:-4px;width:22px;height:22px;border-radius:50%;background:#0B1328;border:2px solid;display:flex;align-items:center;justify-content:center}
.av .badge .ic{width:12px;height:12px}
.av.xl{width:96px;height:96px;font-size:34px;border-width:4px}
.av.xl .badge{width:36px;height:36px;right:-6px;bottom:-2px}
.av.xl .badge .ic{width:20px;height:20px}
.av.sm{width:34px;height:34px;font-size:13px;border-width:2px}
.av.sm .badge{display:none}
.av.star-ring{box-shadow:0 0 0 3px #060A14,0 0 0 5px var(--gold),0 0 24px rgba(255,200,61,.6)}
.beams{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.beam{position:absolute;top:-30%;width:220px;height:160%;background:linear-gradient(180deg,rgba(var(--ink),.07),transparent 70%);filter:blur(6px);transform-origin:top center;animation:sweep 9s ease-in-out infinite alternate}
.beam.b2{animation-duration:11s;animation-delay:-4s}
@keyframes sweep{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(var(--ink),.08) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(180deg,#000,transparent 70%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero{text-align:center;padding:26px 0 10px}
.title{font-size:clamp(54px,10vw,128px);line-height:.86;margin:10px 0 6px;font-weight:900;background:linear-gradient(100deg,#fff 0%,#fff 38%,#FFC83D 48%,#fff 58%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}
.tag-line{font-size:clamp(18px,2.4vw,24px);font-weight:600;color:#D7DEF5}
.vs{display:flex;justify-content:center;align-items:center;gap:clamp(16px,5vw,60px);margin:26px 0 8px}
.fighter{display:flex;flex-direction:column;align-items:center;gap:8px}
.fighter .face{width:96px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;border:3px solid}
.fighter .face .ic{width:54px;height:54px}
.fighter.h .face{border-color:var(--hu);color:var(--hu);background:rgba(61,155,255,.12);box-shadow:0 0 40px rgba(61,155,255,.35);animation:bob 3s ease-in-out infinite}
.fighter.a .face{border-color:var(--ai);color:var(--ai);background:rgba(255,122,47,.12);box-shadow:0 0 40px rgba(255,122,47,.35);animation:bob 3s ease-in-out infinite -1.5s}
@keyframes bob{50%{transform:translateY(-8px)}}
.vsmark{font-size:56px;color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);text-shadow:0 0 24px rgba(255,200,61,.8)}}
.problems{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:22px}
.prob{text-align:left;cursor:pointer;border:2px solid var(--line);border-radius:22px;padding:22px;background:linear-gradient(170deg,var(--p2),var(--p1));color:var(--tx);font:inherit;display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.prob:hover,.prob:focus-visible{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.45);outline:none;border-color:#8FA2DD}
.prob .pic{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.prob .pic .ic{width:36px;height:36px}
.prob h3{font-size:32px;line-height:.95;margin:0}
.prob .go{margin-top:auto;display:flex;align-items:center;gap:8px;font:800 17px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase}
.wbar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.wbar .t{height:6px;border-radius:3px;background:rgba(var(--ink),.08);overflow:hidden}
.wbar .t div{height:100%;border-radius:3px}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.step{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:rgba(var(--ink),.03);border:1px solid var(--line)}
.step .ic{width:30px;height:30px;color:var(--gold)}
.step b{display:block;font:800 18px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em}
.foot{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px}
.seed{font:700 16px 'Barlow Condensed',sans-serif;letter-spacing:.1em;background:var(--p1);color:var(--tx);border:1px solid var(--line);border-radius:10px;min-height:44px;padding:0 12px;width:150px;text-transform:uppercase}
.seed:focus-visible{outline:3px solid var(--hu)}
.bar-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ptitle{font-size:clamp(36px,5vw,56px);line-height:.9;margin:4px 0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.fbtn{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--ink),.03);color:var(--mu);font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.fbtn.on{background:var(--tx);color:#0A1024;border-color:var(--tx)}
.fbtn:focus-visible{outline:3px solid var(--hu)}
.fbtn .ic{width:16px;height:16px}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.pc{padding:14px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(170deg,var(--p2),var(--p1));display:flex;flex-direction:column;gap:10px;animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both;transition:transform .2s,border-color .2s}
.pc:hover{transform:translateY(-4px);border-color:#4A5FA8}
.pc.star{border:2px solid var(--gold);background:linear-gradient(170deg,#3A2E0A,#151A2E 70%);box-shadow:0 0 30px rgba(255,200,61,.18)}
.pc .nm{font:800 20px 'Barlow Condensed',sans-serif;line-height:1;text-transform:uppercase}
.pc .money{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc .money > div{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 8px}
.pc .money .v{font:800 20px 'Barlow Condensed',sans-serif}
.mbar{display:grid;grid-template-columns:84px 1fr 30px;gap:6px;align-items:center;font-size:12px;color:var(--mu)}
.mbar .t{height:7px;border-radius:4px;background:rgba(var(--ink),.08);overflow:hidden}
.mbar .t div{height:100%;border-radius:4px;background:linear-gradient(90deg,#7C8FD0,#C9D4FF)}
.mbar .v{font:700 13px 'Barlow Condensed',sans-serif;color:var(--tx);text-align:right}
.sticky-cta{position:sticky;bottom:12px;display:flex;justify-content:center;margin-top:18px;z-index:5}
.hud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.team{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:18px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);position:relative;overflow:hidden}
.team.h{box-shadow:inset 0 3px 0 var(--hu)}
.team.a{box-shadow:inset 0 3px 0 var(--ai)}
.team .who{display:flex;align-items:center;gap:10px}
.team .face{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:2px solid}
.team.h .face{color:var(--hu);border-color:var(--hu);background:rgba(61,155,255,.12)}
.team.a .face{color:var(--ai);border-color:var(--ai);background:rgba(255,122,47,.12)}
.team .face .ic{width:26px;height:26px}
.team .purse{font-size:40px;line-height:.9;margin-left:auto}
.slots{display:flex;gap:6px}
.slot{width:38px;height:38px;border-radius:50%;border:2px dashed #34457E;display:flex;align-items:center;justify-content:center;color:#34457E}
.slot .ic{width:14px;height:14px}
.slots .av.sm{width:38px;height:38px}
.slot-in{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
@keyframes popA{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1)}}
@keyframes popB{0%{transform:scale(0) rotate(-12deg)}100%{transform:scale(1)}}
.syn{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px}
.syn .t{height:8px;border-radius:4px;background:rgba(var(--ink),.08);overflow:hidden}
.syn .t div{height:100%;border-radius:4px;background:linear-gradient(90deg,#33E0A1,#B8F04A);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.syn .ic{width:15px;height:15px;color:var(--ok)}
.prog{width:170px;height:6px;border-radius:3px;background:rgba(var(--ink),.08);overflow:hidden}
.prog div{height:100%;background:var(--gold);transition:width .5s}
.stage{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.lot{padding:18px;border-radius:22px;background:linear-gradient(170deg,var(--p2),var(--p1));border:1px solid var(--line);position:relative;overflow:hidden}
.lot.inA{animation:lotA .65s cubic-bezier(.2,.9,.3,1.1) both}
.lot.inB{animation:lotB .65s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes lotA{from{opacity:0;transform:perspective(900px) rotateY(-28deg) translateX(-60px)}to{opacity:1;transform:none}}
@keyframes lotB{from{opacity:0;transform:perspective(900px) rotateY(-28deg) translateX(-60px)}to{opacity:1;transform:none}}
.lot.star{border:2px solid var(--gold)}
.lot.star::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(255,200,61,.4) 80%,transparent 90%);animation:spin 4s linear infinite;pointer-events:none}
.lot.star::after{content:"";position:absolute;inset:3px;border-radius:19px;background:linear-gradient(170deg,#2E250A,#121A33 55%);pointer-events:none}
.lot > *{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.marquee{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:#1A1200;font:900 15px 'Barlow Condensed',sans-serif;letter-spacing:.24em;text-transform:uppercase;padding:6px 14px;border-radius:8px;margin-bottom:12px;animation:glow 1.4s ease-in-out infinite}
.marquee .ic{width:16px;height:16px}
@keyframes glow{50%{box-shadow:0 0 26px rgba(255,200,61,.9)}}
.lothead{display:flex;gap:16px;align-items:center}
.lothead h2{font-size:clamp(32px,4.4vw,50px);line-height:.88;margin:0 0 6px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.tile{background:rgba(0,0,0,.28);border-radius:14px;padding:10px 12px}
.tile .v{font-size:28px;line-height:1}
.keys{display:grid;gap:8px}
.kb{display:grid;grid-template-columns:110px 1fr 38px;gap:10px;align-items:center}
.kb .l{font:700 14px 'Barlow Condensed',sans-serif;letter-spacing:.05em;text-transform:uppercase}
.kb .t{height:12px;border-radius:6px;background:rgba(var(--ink),.08);overflow:hidden}
.kb .t div{height:100%;border-radius:6px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.kb .v{font:800 18px 'Barlow Condensed',sans-serif;text-align:right}
.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.at{display:grid;grid-template-columns:minmax(0,1fr) 40px 16px;gap:6px;align-items:center;font-size:11.5px;color:var(--mu)}
.at .t{height:4px;border-radius:2px;background:rgba(var(--ink),.08);overflow:hidden}
.at .t div{height:100%;background:#8FA2DD}
.at .t div.hi{background:var(--gold)}
.at b{font:700 12px 'Barlow Condensed',sans-serif;color:var(--tx);text-align:right}
.starfx{margin-top:14px;display:grid;gap:8px}
.fxrow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;font-size:14px}
.fxrow.up{background:rgba(51,224,161,.1);border:1px solid rgba(51,224,161,.35)}
.fxrow.dn{background:rgba(255,90,106,.08);border:1px solid rgba(255,90,106,.35)}
.fxrow .ic{width:20px;height:20px}
.arena{padding:16px;border-radius:22px;background:linear-gradient(180deg,#121C3C,#0B1229);border:1px solid var(--line);text-align:center;position:sticky;top:10px}
.pricebox{display:flex;align-items:center;justify-content:center;gap:18px}
.price{font-size:clamp(64px,8vw,96px);line-height:.85}
.bumpA{animation:bumpA .45s cubic-bezier(.2,1.8,.4,1)}
.bumpB{animation:bumpB .45s cubic-bezier(.2,1.8,.4,1)}
@keyframes bumpA{0%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
@keyframes bumpB{0%{transform:scale(1.35);color:var(--gold)}100%{transform:scale(1)}}
.lead{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font:800 17px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;border:2px solid var(--line);margin:6px 0 2px;color:var(--mu)}
.lead.h{border-color:var(--hu);color:#06182B;background:var(--hu)}
.lead.a{border-color:var(--ai);color:#2A1000;background:var(--ai)}
.lead .ic{width:18px;height:18px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:112px;height:112px;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:rgba(var(--ink),.1);stroke-width:9}
.ring .arc{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .12s linear,stroke .3s}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c .num{font-size:40px;line-height:.9}
.ring.low{animation:shake .5s ease-in-out infinite}
@keyframes shake{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.bot{display:flex;align-items:center;gap:12px;justify-content:center;margin:10px 0 4px;min-height:64px}
.botface{width:56px;height:56px;border-radius:16px;border:2px solid var(--ai);color:var(--ai);background:rgba(255,122,47,.12);display:flex;align-items:center;justify-content:center;animation:bob 2.4s ease-in-out infinite}
.botface .ic{width:34px;height:34px}
.botface.think{animation:think .5s ease-in-out infinite}
@keyframes think{50%{transform:rotate(-6deg) scale(1.05);box-shadow:0 0 22px rgba(255,122,47,.6)}}
.bubble{position:relative;padding:8px 14px;border-radius:14px;background:var(--ai);color:#2A1000;font:900 22px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase;animation:.45s cubic-bezier(.2,1.6,.4,1) both}
.bubble.k1{animation-name:popA}.bubble.k2{animation-name:popB}
.bubble.pass{background:#2A3A6E;color:var(--tx)}
.dots3 span{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ai);margin:0 3px;animation:dot 1s infinite}
.dots3 span:nth-child(2){animation-delay:.15s}.dots3 span:nth-child(3){animation-delay:.3s}
@keyframes dot{40%{transform:translateY(-8px);opacity:1}0%,80%,100%{opacity:.35}}
.paddles{display:grid;grid-template-columns:1.6fr 1fr;gap:12px;margin-top:10px}
.paddle{min-height:76px;font-size:28px;border-radius:18px}
.paddle .ic{width:28px;height:28px}
.btn-bid{background:linear-gradient(180deg,#5CB0FF,#2C7FE6);color:#fff;box-shadow:0 7px 0 #1B4F94,0 12px 30px rgba(61,155,255,.4)}
.btn-bid:active{box-shadow:0 2px 0 #1B4F94}
.btn-pass{background:#1B2547;border-color:#34457E}
.lockmsg{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:15px;color:#FFD7A8;min-height:22px}
.lockmsg .ic{width:16px;height:16px}
.ticker{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left}
.tk{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:rgba(var(--ink),.03);font-size:14px;animation:slide .35s ease both}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.tk .dot{width:10px;height:10px;border-radius:50%;flex:none}
.tk.sold{background:rgba(255,200,61,.1);color:var(--gold);font-weight:700}
.warnb{display:flex;gap:6px;flex-wrap:wrap}
.ov{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(3,6,14,.78);animation:fade .2s ease both;padding:16px}
.ovbox{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.rays{position:absolute;width:560px;height:560px;left:50%;top:50%;margin:-280px 0 0 -280px;border-radius:50%;animation:spin 6s linear infinite,burst .6s ease-out both;mask-image:radial-gradient(circle,#000 20%,transparent 70%);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 70%)}
@keyframes burst{from{opacity:0}to{opacity:1}}
.gavel{width:120px;height:120px;color:var(--gold);transform-origin:80% 80%;animation:slam .55s cubic-bezier(.5,0,.2,1.4) both}
.gavel .ic{width:120px;height:120px;stroke-width:1.6}
@keyframes slam{0%{transform:rotate(-70deg) translateY(-30px);opacity:0}60%{transform:rotate(12deg);opacity:1}100%{transform:rotate(0)}}
.stamp{font-size:clamp(70px,12vw,130px);line-height:.85;font-weight:900;animation:stamp .5s .25s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 6px 0 rgba(0,0,0,.4)}
@keyframes stamp{0%{transform:scale(2.4) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
.ovline{font:800 28px 'Barlow Condensed',sans-serif;letter-spacing:.04em;text-transform:uppercase;animation:rise .5s .45s both}
.fo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:18px;align-items:start}
.lineup{display:flex;flex-direction:column;gap:10px}
.lu{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
.lu.ai-side{flex-direction:row-reverse;text-align:right}
.lu .nm{font:800 19px 'Barlow Condensed',sans-serif;text-transform:uppercase;line-height:1}
.lu .pr{margin-left:auto;font-size:24px}
.lu.ai-side .pr{margin-left:0;margin-right:auto}
.bigvs{font-size:90px;color:var(--gold);align-self:center;animation:pulse 1.6s ease-in-out infinite}
.stats{display:grid;gap:8px;margin-top:6px}
.twist{text-align:center;padding:28px 18px;border-radius:24px;border:2px solid var(--gold);background:radial-gradient(600px 240px at 50% 0,rgba(255,200,61,.25),transparent),var(--p1);position:relative;overflow:hidden}
.twist .bolt{width:86px;height:86px;color:var(--gold);animation:zap 1.2s ease-in-out infinite}
.twist .bolt .ic{width:86px;height:86px}
@keyframes zap{0%,100%{transform:scale(1)}10%{transform:scale(1.25) rotate(-8deg)}20%{transform:scale(.95) rotate(6deg)}30%{transform:scale(1.1)}}
.twistword{font-size:clamp(64px,10vw,110px);line-height:.85;color:var(--gold);animation:stamp .55s cubic-bezier(.2,1.6,.4,1) both}
.twist h2{font-size:clamp(30px,4vw,44px);margin:10px 0 4px}
.race{display:grid;gap:14px}
.kp{padding:14px;border-radius:16px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line)}
.kp.hit{border-color:rgba(255,90,106,.7);box-shadow:inset 0 0 0 1px rgba(255,90,106,.4)}
.lane{display:grid;grid-template-columns:44px 1fr 56px;gap:10px;align-items:center;margin-top:8px}
.lane .tr{height:22px;border-radius:8px;background:rgba(var(--ink),.06);overflow:hidden}
.lane .fl{height:100%;border-radius:8px;transition:width 1.8s cubic-bezier(.2,.8,.2,1)}
.fl.h{background:linear-gradient(90deg,#1E5FB8,#5CB0FF)}
.fl.a{background:linear-gradient(90deg,#B4470F,#FF8E4A)}
.lane .v{font-size:24px;text-align:right}
.score2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbox{padding:16px;border-radius:18px;text-align:center;background:rgba(0,0,0,.28)}
.sbox .num{font-size:64px;line-height:.9}
.expo{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ex{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;font-size:14px;background:rgba(var(--ink),.04);border:1px solid var(--line);animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
.ex.hit{border-color:rgba(255,90,106,.7);color:#FFB3BB}
.ex.cov{border-color:rgba(51,224,161,.6);color:#A8F5D6}
.ex .ic{width:16px;height:16px}
.win{position:relative;text-align:center;padding:30px 16px 26px;border-radius:28px;overflow:hidden;margin-bottom:16px}
.win.h{background:radial-gradient(700px 300px at 50% 0,rgba(61,155,255,.45),transparent 70%),var(--p1);border:2px solid var(--hu)}
.win.a{background:radial-gradient(700px 300px at 50% 0,rgba(255,122,47,.45),transparent 70%),var(--p1);border:2px solid var(--ai)}
.win.t{background:radial-gradient(700px 300px at 50% 0,rgba(255,200,61,.35),transparent 70%),var(--p1);border:2px solid var(--gold)}
.win > *{position:relative;z-index:1}
.win > .conf{position:absolute;z-index:0}
.trophy{width:130px;height:130px;margin:0 auto;color:var(--gold);animation:trophy 1s cubic-bezier(.2,1.6,.4,1) both,float 3s 1s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,200,61,.7))}
.trophy .ic{width:130px;height:130px;stroke-width:1.5}
@keyframes trophy{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1)}}
@keyframes float{50%{transform:translateY(-10px)}}
.robowin{width:130px;height:130px;margin:0 auto;color:var(--ai);animation:trophy 1s cubic-bezier(.2,1.6,.4,1) both,dance .6s 1s ease-in-out infinite;filter:drop-shadow(0 0 26px rgba(255,122,47,.7))}
.robowin .ic{width:130px;height:130px;stroke-width:1.5}
@keyframes dance{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
.bigword{font-size:clamp(64px,11vw,130px);line-height:.85;margin:8px 0 8px;animation:stamp .6s .2s cubic-bezier(.2,1.6,.4,1) both}
.finals{display:flex;justify-content:center;gap:clamp(20px,6vw,80px);margin-top:12px;align-items:flex-end}
.finals .num{font-size:clamp(56px,8vw,88px);line-height:.85}
.conf{inset:0;pointer-events:none;overflow:hidden}
.cf{position:absolute;top:-20px;border-radius:2px;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(760px) rotate(720deg)}}
.why3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.why{padding:16px;border-radius:18px;background:linear-gradient(180deg,var(--p2),var(--p1));border:1px solid var(--line);animation:rise .55s cubic-bezier(.2,.9,.3,1.2) both}
.why .ic{width:30px;height:30px}
.why .pts{font-size:46px;line-height:.9;margin:6px 0 2px}
.bu{display:grid;gap:12px}
.bur{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
.bur .bars{display:grid;gap:4px}
.bl{display:grid;grid-template-columns:1fr 54px;gap:8px;align-items:center}
.bl .t{height:12px;border-radius:6px;background:rgba(var(--ink),.06);overflow:hidden}
.bl .t div{height:100%;border-radius:6px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.bl b{font:800 16px 'Barlow Condensed',sans-serif;text-align:right}
.hires{display:grid;gap:8px}
.hr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:rgba(var(--ink),.03);border:1px solid var(--line)}
.hr .pr{font-size:20px;text-align:right;line-height:1}
.sec{font-size:30px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec .ic{width:26px;height:26px;color:var(--gold)}
details.more{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:rgba(var(--ink),.02)}
details.more summary{cursor:pointer;padding:14px 16px;font:800 17px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase}
details.more summary:focus-visible{outline:3px solid var(--hu)}
details.more > div{padding:0 16px 16px}
table.sm{width:100%;border-collapse:collapse;font-size:14px;min-width:540px}
table.sm th,table.sm td{padding:8px 6px;border-bottom:1px solid #22305E;text-align:left}
table.sm th{font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
table.sm td.n,table.sm th.n{text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px}
.tw{overflow-x:auto}
.test{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pass{color:var(--ok);font:800 15px 'Barlow Condensed',sans-serif}
.fail{color:var(--bad);font:800 15px 'Barlow Condensed',sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---- landing ---- */
.landing{min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,2.4vh,22px);padding:clamp(8px,3vh,32px) 0}
.landing .title{margin:0}
.landing .vs{margin:0}
.howto{list-style:none;margin:clamp(4px,1.5vh,14px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:100%;max-width:860px}
.hstep{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px 14px;border-radius:18px;background:rgba(var(--ink),.035);border:1px solid var(--line);animation:rise .55s cubic-bezier(.2,.9,.3,1.2) both}
.hstep .hn{position:absolute;top:10px;left:12px;font:800 13px 'Barlow Condensed',sans-serif;color:var(--mu)}
.hstep .hic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:rgba(255,200,61,.12);color:var(--gold);margin-bottom:4px}
.hstep .hic .ic{width:28px;height:28px}
.hstep b{font:800 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.hstep > span:last-child{font-size:13px;color:var(--mu)}
.btn-start{min-height:68px;font-size:26px;padding:0 44px;margin-top:clamp(4px,1.5vh,14px);animation:startglow 2s ease-in-out infinite}
.btn-start .ic{width:26px;height:26px}
@keyframes startglow{0%,100%{box-shadow:0 6px 0 #A87700,0 10px 30px rgba(255,200,61,.35)}50%{box-shadow:0 6px 0 #A87700,0 10px 46px rgba(255,200,61,.75)}}
@media (max-width:620px){
  .howto{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .hstep{padding:12px 8px 10px}
  .hstep .hic{width:42px;height:42px}
  .btn-start{width:100%;min-height:60px;font-size:22px}
}
/* ---- landing: problem list rows ---- */
.probrow{display:grid;grid-template-columns:72px minmax(0,1.5fr) minmax(0,1fr) auto;gap:20px;align-items:center;width:100%;padding:18px 22px;text-align:left;font:inherit;color:var(--tx);cursor:pointer;border:1px solid var(--line);border-left:5px solid;border-radius:20px;background:linear-gradient(90deg,var(--p2),var(--p1));animation:rise .55s cubic-bezier(.2,.9,.3,1.2) both;transition:transform .18s,box-shadow .18s,border-color .18s}
.probrow:hover{transform:translateX(6px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.probrow:focus-visible{outline:3px solid var(--hu);outline-offset:2px}
.probrow .pic{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.probrow .pic .ic{width:40px;height:40px}
.probrow .pm{min-width:0;display:block}
.probrow .pn{display:block;font-size:34px;line-height:.95}
.probrow .ps{display:block;font-size:14px;line-height:1.45;margin-top:8px;min-width:0;overflow-wrap:anywhere}
.probrow .pk{display:grid;gap:5px}
.probrow .wbar .t{display:block}
.probrow .go{display:flex;align-items:center;gap:8px;font:800 20px 'Barlow Condensed',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:12px 16px;border-radius:14px;background:rgba(var(--ink),.05)}
.probrow:hover .go{background:rgba(var(--ink),.1)}
@media (max-width:820px){
  .probrow{grid-template-columns:56px minmax(0,1fr) auto;gap:14px;padding:14px}
  .probrow .pic{width:56px;height:56px}
  .probrow .pk{grid-column:1 / -1}
  .probrow .pn{font-size:26px}
  .probrow .ps{font-size:13px;margin-top:6px}
}
/* ---- pool: groups, grid cards, list rows ---- */
.vtog{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vtog button{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;background:transparent;border:0;color:var(--mu);font:700 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.vtog button.on{background:var(--gold);color:#1A1200}
.vtog button:focus-visible{outline:3px solid var(--hu);outline-offset:-3px}
.vtog .ic{width:16px;height:16px}
.grp{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.grp .d{font-size:26px}
.grp .cnt{margin-left:auto}
.pool{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px}
.pc{text-align:left;font:inherit;color:var(--tx);cursor:pointer;padding:16px;gap:12px;height:100%}
.pc:focus-visible{outline:3px solid var(--hu);outline-offset:2px}
.pc .top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.pc .lotno{font:800 13px 'Barlow Condensed',sans-serif;color:var(--mu);border:1px solid var(--line);border-radius:8px;padding:2px 7px;align-self:start}
.pc .nm{min-height:40px;display:flex;align-items:center}
.pc .sub{font-size:13px;color:var(--mu);min-height:18px}
.pc .view{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid rgba(var(--ink),.07);font:700 13px 'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.pc:hover .view{color:var(--gold)}
.pc .view .ic{width:16px;height:16px}
.plist{display:grid;gap:6px}
.lh,.lr{display:grid;grid-template-columns:40px minmax(0,2.2fr) minmax(0,1fr) 84px 50px 70px 74px minmax(0,1.8fr) 26px;gap:12px;align-items:center;padding:8px 12px}
.lh{font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mu)}
.lr{width:100%;text-align:left;font:inherit;color:var(--tx);background:linear-gradient(90deg,var(--p2),var(--p1));border:1px solid var(--line);border-radius:14px;cursor:pointer;min-height:64px;animation:slide .35s ease both;transition:border-color .15s,transform .15s}
.lr:hover{border-color:#5A6FB8;transform:translateX(3px)}
.lr:focus-visible{outline:3px solid var(--hu)}
.lr.star{border-color:var(--gold);background:linear-gradient(90deg,#3A2E0A,var(--p1) 60%)}
.lr .who{display:flex;align-items:center;gap:10px;min-width:0}
.lr .who b{display:block;font:800 18px 'Barlow Condensed',sans-serif;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .who small{display:block;color:var(--mu);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr .n{font:800 19px 'Barlow Condensed',sans-serif;text-align:right}
.lr .ks{display:grid;gap:3px}
.lr .ks .mbar{grid-template-columns:70px 1fr 26px;font-size:11px}
.lr .go .ic{width:18px;height:18px;color:var(--mu)}
/* ---- profile drawer ---- */
.pfwrap{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.pfback{position:absolute;inset:0;background:rgba(3,6,14,.72);border:0;cursor:pointer;animation:fade .25s ease both}
.pf{position:relative;width:min(980px,100%);height:100%;overflow-y:auto;background:#0A1124;border-left:1px solid var(--line);box-shadow:-30px 0 60px rgba(0,0,0,.5);animation:drawer .38s cubic-bezier(.2,.9,.3,1) both}
@keyframes drawer{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}
.pfhead{position:relative;padding:22px 22px 18px;overflow:hidden}
.pfhead .glow{position:absolute;inset:0;opacity:.35;pointer-events:none}
.pfhead > *{position:relative}
.pfbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.icbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--ink),.04);color:var(--tx);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.icbtn:hover{border-color:var(--mu)}
.icbtn:disabled{opacity:.35;cursor:not-allowed}
.icbtn:focus-visible{outline:3px solid var(--hu)}
.pfid{display:flex;gap:18px;align-items:center}
.pfid h2{font-size:clamp(34px,5vw,56px);line-height:.88;margin:0 0 8px}
.pfbody{padding:0 22px 26px;display:grid;gap:16px}
.pfgrid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pfgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.st{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px}
.st .v{font-size:30px;line-height:1}
.st small{display:block;color:var(--mu);font-size:12px;margin-top:4px}
.scope{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;font-size:15px}
.scope.in{background:rgba(51,224,161,.1);border:1px solid rgba(51,224,161,.4)}
.scope.out{background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.4)}
.scope .ic{width:26px;height:26px}
.fitrow{display:grid;grid-template-columns:120px 48px 1fr 44px 72px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(var(--ink),.06)}
.fitrow .t{height:12px;border-radius:6px;background:rgba(var(--ink),.08);overflow:hidden;position:relative}
.fitrow .t .f{height:100%;border-radius:6px;animation:grow .9s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
.fitrow .t .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.radarbox{position:relative;width:100%;max-width:340px;margin:0 auto;aspect-ratio:1}
.radarbox svg{width:100%;height:100%}
.radar .rg{fill:none;stroke:rgba(var(--ink),.1);stroke-width:1}
.radar .sp{stroke:rgba(var(--ink),.1);stroke-width:1}
.radar .avgp{fill:rgba(var(--ink),.06);stroke:rgba(var(--ink),.55);stroke-width:1.5;stroke-dasharray:4 4}
.radar .mep{stroke-width:2.5;animation:radarIn .8s cubic-bezier(.2,1.2,.4,1) both;transform-origin:50% 50%}
@keyframes radarIn{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.axl{position:absolute;transform:translate(-50%,-50%);font:700 12px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);text-align:center;line-height:1.05;white-space:nowrap}
.axl b{display:block;color:var(--tx);font-size:15px}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mu);margin-top:6px}
.legend i{display:inline-block;width:18px;height:3px;vertical-align:middle;margin-right:6px}
.atb{display:grid;grid-template-columns:minmax(0,1fr) 120px 26px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.atb .t{height:8px;border-radius:4px;background:rgba(var(--ink),.08);position:relative}
.atb .t .f{height:100%;border-radius:4px;background:#8FA2DD;animation:grow .8s cubic-bezier(.2,.9,.3,1) both;transform-origin:left}
.atb .t .f.hi{background:var(--gold)}
.atb .t .f.lo{background:#FF8A95}
.atb .t .avg{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
.atb b{font:800 15px 'Barlow Condensed',sans-serif;text-align:right}
.chipwrap{display:flex;flex-wrap:wrap;gap:8px}
.syn2{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--ink),.03);font-size:14px}
.syn2 .ic{width:18px;height:18px}
.syn2 b{font:800 18px 'Barlow Condensed',sans-serif;color:var(--ok)}
.report{font-size:17px;line-height:1.5;color:#E2E8FA;padding:14px 16px;border-radius:14px;background:var(--p1);border-left:4px solid}
.peer{display:grid;grid-template-columns:auto minmax(0,1fr) 70px 70px 20px;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--ink),.03);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.peer:hover{border-color:#5A6FB8}
.peer:focus-visible{outline:3px solid var(--hu)}
.peer .n{font:800 17px 'Barlow Condensed',sans-serif;text-align:right}
.pfsec{font:800 20px 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;display:flex;align-items:center;gap:8px}

.callbar.lead-a{color:var(--ai);border-color:var(--ai)}

.bidder{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;border-radius:18px;border:2px solid transparent;transition:border-color .3s,background .3s,transform .3s}

@keyframes moodA{0%{transform:scale(.7) rotate(-8deg)}100%{transform:none}}

.rig .rl-fx{transform:translateZ(calc(var(--d) * 70px));pointer-events:none}

/* speech bubbles come out of the character's mouth, not the middle of the card */
.bubble{isolation:isolate;transform-origin:20% 100%}
.bubble::after{content:"";position:absolute;bottom:-5px;left:14px;width:13px;height:13px;background:inherit;transform:rotate(45deg);z-index:-1;border-radius:2px}
.bidder .bpos{top:-2px;transform:none}
.bidder.h .bpos{left:56%}
.bidder.a .bpos{left:auto;right:56%}
.bidder.a .bubble{transform-origin:80% 100%}.bidder.a .bubble::after{left:auto;right:14px}
@media (max-width:620px){.bidder.h .bpos{left:52%;top:-14px}.bidder.a .bpos{right:52%;top:-14px}}
/* landing: the bubble rides on the character's head; the body fades into the floor */
.vsside .charbox{-webkit-mask-image:none;mask-image:none}
.charbox .rl-body,.charbox .rl-arm{-webkit-mask-image:linear-gradient(180deg,#000 80%,transparent 99%);mask-image:linear-gradient(180deg,#000 80%,transparent 99%)}
.vsside .charbox .vsbub{position:absolute;z-index:6;top:5%;width:auto;min-height:0}
.vsside .charbox.h .vsbub{left:68%;right:auto}
.vsside .charbox.a .vsbub{right:68%;left:auto}
.charbox .bub::after{left:20px;margin-left:0}
.charbox.a .bub::after{left:auto;right:20px}
.charbox .bub{transform-origin:15% 100%}.charbox.a .bub{transform-origin:85% 100%}
@media (max-width:620px){.vsside .charbox.h .vsbub{left:48%;top:0}.vsside .charbox.a .vsbub{right:48%;top:0}}

/* the stage around them */
.vsstage{max-width:1180px;gap:0;align-items:end;margin:0 auto}
.vsside{display:block;position:relative;min-width:0;gap:0}
.charbox{position:relative;width:min(100%,460px,46vh);-webkit-mask-image:linear-gradient(180deg,#000 82%,transparent 100%);mask-image:linear-gradient(180deg,#000 82%,transparent 100%)}
.charbox.h{margin-right:auto}.charbox.a{margin-left:auto}
.ta:not(.light) .cboy{filter:drop-shadow(0 0 1.5px rgba(150,190,255,.75)) drop-shadow(0 0 22px rgba(61,155,255,.35))}
.ta:not(.light) .cbot{filter:drop-shadow(0 0 18px rgba(255,122,47,.28))}
.vsside .vsbub{position:absolute;top:0;z-index:3;min-height:0;width:auto;display:block}

.vsside .bub{white-space:nowrap;max-width:none}
.vstag{position:absolute;bottom:34px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:4px}

.vstag .mood{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.vstag .mood{display:inline-block;font:700 11px 'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:rgba(var(--ink),.08);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.vscore{align-self:center;padding:0 clamp(4px,1.5vw,18px) 8%;position:relative}
.vscore .vsmark{position:relative;z-index:1}
.vsbudget{white-space:nowrap;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(var(--ink),.05)}
.vsbolt{position:absolute;top:2px;width:clamp(22px,2.6vw,34px);height:auto;z-index:2}

@keyframes boltL{0%,70%,100%{opacity:.85;transform:rotate(-24deg) scale(1)}78%{opacity:1;transform:rotate(-30deg) scale(1.25)}86%{opacity:.4;transform:rotate(-20deg) scale(.9)}}

.landing.intro .charbox.a{animation:charInR .8s 1.1s cubic-bezier(.2,.9,.3,1.1) both}

.lbhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

.lbboard{max-width:860px;margin:0 auto}

.lbrows{display:flex;flex-direction:column;gap:8px}

/* ===================== GAME MODES ===================== */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px}
.modecard{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 20px 20px;border-radius:24px;border:2px solid var(--line);background:linear-gradient(170deg,var(--p2),var(--p1));color:var(--tx);font:inherit;cursor:pointer;overflow:hidden;animation:rise .6s cubic-bezier(.2,.9,.3,1.2) both;transition:transform .2s,border-color .2s,box-shadow .2s}

.modecard>*{position:relative}
.mfaces{display:flex;align-items:center;justify-content:center;gap:12px;min-height:104px}

.mtext{color:var(--mu);font-size:15px;line-height:1.45;max-width:34ch}
